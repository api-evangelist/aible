  - name: key
    description: Observed null on auth failures; purpose undocumented. Likely names the offending field or entity.
  machine_readable_code: false
  note: >-
    `type` is prose, not a stable enumerated code, and no error-code reference is published. An agent
    cannot branch reliably on this envelope beyond the HTTP status.

