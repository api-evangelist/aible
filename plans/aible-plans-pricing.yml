notes:
- >-
  Credits are consumed by Aible's products (Sense, Explore, Optimize) and professional services. The
  per-product credit cost is not published on any public page reachable without a sales conversation,
  so it is not recorded here.
- >-
  Aible runs inside the customer's own cloud account, so the underlying compute, storage and model
  inference costs are billed by AWS / Azure / GCP separately and are not covered by Flex Credits.
- >-
  The API exposes commerce routes of its own — /v1/marketplaces, /v1/marketplace/<id>/offers,
  /v1/offer/<id>/buy, /v1/purchased/<id>, /v1/licensing, plus AWS Flex-credit provisioning hooks at
  /v1/aws/flex/<customer_id>/<product_code>/add — so purchasing is programmable, but the catalogue
  behind those routes is tenant-scoped and not publicly readable.
