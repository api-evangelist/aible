apis:
- aid: aible:aible-api
  name: Aible API
  description: 'The Aible API server (self-reported version 2.0.0) is the control plane behind the Aible
    platform. Its published route index lists 394 routes under the /v1 prefix across 29 modules — account,
    project, folder, training_data, training, jobs, run, model, deployment, content_generation, language_model_artifact,
    chat_tone, report, schema_monitor, tag, tenant, login, marketplace, licensing and more. Nearly every
    route requires an Authorization: Bearer header carrying a user token, tenant token or federated STS
    token; the index labels each route with which token class it needs.'
