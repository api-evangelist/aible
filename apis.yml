aid: aible
name: Aible
description: Aible is an enterprise AI company founded in 2018 and headquartered in Pleasanton, California,
  that lets business users build and run AI agents, AutoML models and generative-AI analytics against
  data that stays inside the customer's own AWS, Azure, GCP or on-premise account. The platform is organized
  around projects, segments, scenarios, training data, jobs, models, deployments and content-generation
  collections, and is operated through a public REST API served at api.iamaible.com. That API server publishes
  its own route index — 394 routes across 29 modules at /v1, protected by bearer user, tenant and STS
  tokens — but Aible ships no OpenAPI, AsyncAPI, MCP server, agent card, SDK or public developer portal.
  Commercial access is sold as prepaid Flex Credits through the AWS and Google Cloud marketplaces.
